# Pushing a tag like v1.0 zips every addon folder (a folder with a .toc of
# the same name, except the ApiProbe dev tool) into one zip and publishes it
# as a GitHub release, which WowUp-CF picks up as an update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # WoW runs Lua 5.1; a file that does not compile stops the release.
      - name: Check Lua syntax
        run: |
          sudo apt-get install -y -qq lua5.1 >/dev/null
          luac5.1 -v
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.1 -p

      # Postnord tells members when the guild has a newer pack; it learns the
      # pack's version from the tag (v1.6.1 -> 1.6.1). From the repo it says dev.
      - name: Stamp the pack version
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^## Version: dev.*/## Version: $version/" Postnord/Postnord.toc
          grep -q "^## Version: $version" Postnord/Postnord.toc

      - name: Zip the addons
        run: |
          # WowUp-CF only downloads a zip whose name ends in -forever for the
          # Forever client.
          zipname="wow-mods-${GITHUB_REF_NAME}-forever.zip"
          addons=""
          for d in */; do
            d="${d%/}"
            if [ -f "$d/$d.toc" ] && [ "$d" != "ApiProbe" ]; then addons="$addons $d"; fi
          done
          echo "Addons:$addons"
          mkdir dist
          zip -r -X "dist/$zipname" $addons -x '*.md'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
